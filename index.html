<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123b67"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Suivi heures"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><title>Suivi heures 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#15253a;font:16px system-ui,-apple-system,sans-serif}header{background:#123b67;color:white;padding:24px 18px 28px;border-radius:0 0 24px 24px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;opacity:.85}.wrap{max-width:800px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel{background:white;border-radius:16px;padding:16px;box-shadow:0 3px 12px #18345412}.card small{color:#66778b}.val{font-size:26px;font-weight:750;margin-top:6px}.panel{margin-top:15px}h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:14px;margin:10px 0 5px;color:#45566c}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d6dfeb;width:100%;background:white;color:inherit}button{border:0;background:#123b67;color:white;font-weight:650;cursor:pointer;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{margin:0;background:#dfe8f3;color:#123b67}.tabs button.active{background:#123b67;color:white}.entry{border-bottom:1px solid #edf0f4;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.entry:last-child{border:0}.muted{color:#687b91;font-size:13px}.negative{color:#b42318}.positive{color:#11804a}.monthrow{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.danger{background:#a72b2b}.actions{display:flex;gap:8px}.actions button{flex:1}footer{padding:18px;text-align:center;color:#718096;font-size:12px}@media(min-width:650px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>⏱ Suivi de mes heures</h1><p>2026 · Base 5 h/jour · Contrat 25 h/semaine</p></header><div class="wrap"><div class="cards"><div class="card"><small>Solde heures sup.</small><div class="val" id="balance">0 h</div></div><div class="card"><small>Heures travaillées</small><div class="val" id="worked">0 h</div></div><div class="card"><small>Cette semaine</small><div class="val" id="week">0 h</div></div><div class="card"><small>Ce mois</small><div class="val" id="month">0 h</div></div></div><div class="panel"><h2>➕ Saisir une journée</h2><label>Date</label><input id="date" type="date"><div class="row"><div><label>Heures</label><input id="hours" type="number" min="0" max="24" value="5"></div><div><label>Minutes</label><input id="minutes" type="number" min="0" max="59" value="0"></div></div><label>Note (facultative)</label><input id="note" placeholder="Ex. tournée, rendez-vous…"><button onclick="save()">Enregistrer la journée</button></div><div class="tabs"><button id="tabdays" class="active" onclick="view('days')">Jours</button><button id="tabweeks" onclick="view('weeks')">Semaines</button><button id="tabmonths" onclick="view('months')">Mois</button></div><div class="panel"><div id="list"></div></div><div class="panel"><h2>💾 Sauvegarde / Export</h2><div class="actions"><button onclick="exportCSV()">Exporter CSV</button><button onclick="backup()">Sauvegarder</button></div><label>Restaurer une sauvegarde</label><input type="file" accept="application/json" onchange="restore(event)"><button class="danger" onclick="clearAll()">Effacer toutes les données</button></div></div><footer>Données enregistrées localement sur cet appareil.</footer><script>
const KEY='suiviHeures2026_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{}'),mode='days';const names=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];const fmt=n=>{let s=n<0?'−':'';n=Math.abs(n);let h=Math.floor(n),m=Math.round((n-h)*60);if(m===60){h++;m=0}return s+h+' h'+(m?(' '+m+' min'):'')};function day(d){return new Date(d+'T12:00:00')}function wk(d){let x=day(d),a=new Date(x);a.setDate(a.getDate()-((a.getDay()+6)%7));return a.toISOString().slice(0,10)}function monthkey(d){return d.slice(0,7)}function val(d){return +(data[d]?.hours||0)+ +(data[d]?.minutes||0)/60}function delta(d){return val(d)-5}function sorted(){return Object.keys(data).sort()}function save(){let d=document.getElementById('date').value;if(!d){alert('Choisissez une date');return}data[d]={hours:+hours.value||0,minutes:+minutes.value||0,note:note.value};localStorage.setItem(KEY,JSON.stringify(data));note.value='';render()}function view(m){mode=m;['days','weeks','months'].forEach(x=>document.getElementById('tab'+x).classList.toggle('active',x===m));render()}function render(){let keys=sorted(),total=keys.reduce((s,d)=>s+val(d),0),balance=keys.reduce((s,d)=>s+delta(d),0),now=new Date(),today=now.toISOString().slice(0,10),wk0=wk(today),mo=monthkey(today);document.getElementById('balance').textContent=fmt(balance);document.getElementById('balance').className='val '+(balance>=0?'positive':'negative');document.getElementById('worked').textContent=fmt(total);document.getElementById('week').textContent=fmt(keys.filter(d=>wk(d)===wk0).reduce((s,d)=>s+val(d),0));document.getElementById('month').textContent=fmt(keys.filter(d=>monthkey(d)===mo).reduce((s,d)=>s+val(d),0));let out='';if(mode==='days'){out=keys.reverse().map(d=>`<div class="entry"><div><b>${day(d).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'long'})}</b><div class="muted">${data[d].note||''}</div></div><div style="text-align:right"><b>${fmt(val(d))}</b><div class="muted ${delta(d)>=0?'positive':'negative'}">${delta(d)>=0?'+':''}${fmt(delta(d))}</div><button style="margin:5px 0 0;padding:5px 9px;width:auto" onclick="edit('${d}')">Modifier</button></div></div>`).join('')||'<p class="muted">Aucune journée saisie.</p>'}else if(mode==='weeks'){let groups={};keys.forEach(d=>{let w=wk(d);groups[w]=(groups[w]||[]).concat(d)});out=Object.keys(groups).sort().reverse().map(w=>{let sum=groups[w].reduce((s,d)=>s+val(d),0),b=groups[w].reduce((s,d)=>s+delta(d),0);return `<div class="monthrow"><div><b>Semaine du ${day(w).toLocaleDateString('fr-FR')}</b><div class="muted">${groups[w].length} jour(s) renseigné(s)</div></div><div style="text-align:right"><b>${fmt(sum)}</b><div class="${b>=0?'positive':'negative'}">${b>=0?'+':''}${fmt(b)}</div></div></div>`}).join('')||'<p class="muted">Pas encore de données.</p>'}else{let groups={};keys.forEach(d=>{let m=monthkey(d);groups[m]=(groups[m]||[]).concat(d)});out=Object.keys(groups).sort().reverse().map(m=>{let sum=groups[m].reduce((s,d)=>s+val(d),0),b=groups[m].reduce((s,d)=>s+delta(d),0);let n=names[+m.slice(5)-1];return `<div class="monthrow"><div><b>${n} ${m.slice(0,4)}</b><div class="muted">${groups[m].length} jour(s)</div></div><div style="text-align:right"><b>${fmt(sum)}</b><div class="${b>=0?'positive':'negative'}">${b>=0?'+':''}${fmt(b)}</div></div></div>`}).join('')||'<p class="muted">Pas encore de données.</p>'}list.innerHTML=out}function edit(d){let v=data[d];date.value=d;hours.value=v.hours;minutes.value=v.minutes;note.value=v.note||'';window.scrollTo({top:0,behavior:'smooth'})}function exportCSV(){let rows=[['Date','Heures','Minutes','Temps total','Écart vs 5h','Note']];sorted().forEach(d=>rows.push([d,data[d].hours,data[d].minutes,val(d).toFixed(2),delta(d).toFixed(2),data[d].note||'']));let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Suivi_heures_2026.csv';a.click()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Sauvegarde_heures_2026.json';a.click()}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);localStorage.setItem(KEY,JSON.stringify(data));render();alert('Sauvegarde restaurée')}catch{alert('Fichier invalide')}};r.readAsText(f)}function clearAll(){if(confirm('Supprimer toutes les journées enregistrées ?')){data={};localStorage.removeItem(KEY);render()}}date.value=new Date().toISOString().slice(0,10);render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>
