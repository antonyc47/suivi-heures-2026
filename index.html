function exportCSV(){let rows=[['Date','Heures','Minutes','Temps total','Écart vs 5h','Note']];sorted().forEach(d=>rows.push([d,data[d].hours,data[d].minutes,val(d).toFixed(2),delta(d).toFixed(2),data[d].note||'']));let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Suivi_heures_2026.csv';a.click()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Sauvegarde_heures_2026.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);localSave();syncPush();alert('Sauvegarde restaurée et synchronisation lancée')}catch{alert('Fichier invalide')}};r.readAsText(f)}
async function clearAll(){if(confirm('Supprimer toutes les journées enregistrées sur cet appareil ET dans la synchronisation ?')){data={};localStorage.removeItem(KEY);render();try{await supa('DELETE',TABLE+'?date_jour=not.is.null');status('Données supprimées localement et sur Supabase')}catch(e){status('Données effacées localement, suppression distante non confirmée');console.error(e)}}}
